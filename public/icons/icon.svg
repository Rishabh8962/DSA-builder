<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Vibrant Indigo to Purple Glow -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Cyan to Violet High-Energy Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Emerald Target Indicator -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="outerDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Rim -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Background Orbit Grid Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Center Hexagonal Frame with Glow -->
  <polygon points="256,90 396,172 396,340 256,422 116,340 116,172"
           fill="#0e162c" stroke="url(#primaryGlow)" stroke-width="7" filter="url(#outerDrop)"/>

  <!-- Inner Hexagon Detail -->
  <polygon points="256,118 368,184 368,328 256,394 144,328 144,184"
           fill="#090e1f" stroke="#1e293b" stroke-width="2"/>

  <!-- Central Dynamic "P" & GATE/DSA Rocket Crest -->
  <!-- Stylized Monogram P and Ascending Target Vector -->
  <path d="M 210 360 L 210 160 L 275 160 C 315 160 338 180 338 215 C 338 250 315 270 275 270 L 210 270"
        fill="none" stroke="url(#primaryGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ascending Mastery Arrow (Target 70+ / Placement offer) -->
  <path d="M 280 290 L 335 235 M 335 235 L 305 235 M 335 235 L 335 265"
        stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Decorative Orbit Nodes -->
  <!-- Top Node: GATE CS Focus -->
  <circle cx="256" cy="90" r="12" fill="#38bdf8" filter="url(#softGlow)"/>
  <!-- Bottom Left: DSA in Java -->
  <circle cx="116" cy="340" r="10" fill="#a855f7"/>
  <!-- Bottom Right: Core Habits / Streak -->
  <circle cx="396" cy="340" r="10" fill="#10b981"/>

  <!-- Mini Core Star at Origin -->
  <circle cx="210" cy="160" r="7" fill="#ffffff"/>
</svg>
