<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0c1224"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="24" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle decorative grid lines -->
  <path d="M 0 60 L 800 60 M 0 120 L 800 120 M 0 180 L 800 180" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 8"/>
  <path d="M 180 0 L 180 240 M 360 0 L 360 240 M 540 0 L 540 240" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 8"/>

  <!-- Logo Icon Container -->
  <g transform="translate(60, 40)">
    <!-- Hexagonal Glow Ring -->
    <polygon points="80,10 145,45 145,115 80,150 15,115 15,45" fill="#131d36" stroke="url(#primary-grad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner Orbit Lines -->
    <circle cx="80" cy="80" r="50" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="80" cy="80" r="32" fill="#0d1428" stroke="url(#cyan-violet)" stroke-width="2"/>

    <!-- Stylized Futuristic 'G' Symbol with Progress Arrow -->
    <path d="M 98 62 C 92 52 80 48 68 52 C 54 57 46 70 46 84 C 46 98 56 110 72 110 C 88 110 98 100 98 88 L 74 88" 
          fill="none" stroke="url(#primary-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mini accent nodes: Plan (top left), Practice (top right), Progress (rising) -->
    <circle cx="35" cy="50" r="5" fill="#38bdf8"/>
    <circle cx="125" cy="50" r="5" fill="#a855f7"/>
    <circle cx="80" cy="132" r="5" fill="#10b981"/>

    <!-- Upward Momentum Indicator -->
    <path d="M 110 95 L 126 79 M 126 79 L 116 79 M 126 79 L 126 89" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(240, 65)">
    <!-- Main Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">
      GRINDLY
    </text>

    <!-- Subtitle: Plan • Practice • Progress -->
    <text x="2" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="700" fill="url(#cyan-violet)" letter-spacing="4">
      PLAN • PRACTICE • PROGRESS
    </text>

    <!-- Tagline Badge -->
    <g transform="translate(0, 104)">
      <rect width="180" height="26" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1.5">
        GATE &amp; PLACEMENT OS
      </text>
    </g>

    <!-- Target Milestone pill -->
    <g transform="translate(192, 104)">
      <rect width="118" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" letter-spacing="1">
        TARGET: 70+
      </text>
    </g>
  </g>
</svg>
